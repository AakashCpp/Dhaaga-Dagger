name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: npm run check
        working-directory: backend
      - run: npm test
        working-directory: backend
